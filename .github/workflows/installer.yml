name: Installer

# A release is cut only when the version changes, so a commit that does not bump
# <Version> in HASNetMonitor.csproj runs the cheap version check and stops there
# instead of rebuilding the Setup and re-uploading the same asset. Bump the version
# to ship; the tag v<version> is what marks a version as already released.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A release has to be created and an asset attached to it, which is a write.
permissions:
  contents: write

jobs:
  # Reads the one source of version truth and asks whether that version is already
  # out. Runs on Linux because it only parses XML and calls gh - no Windows needed.
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $xml = [xml](Get-Content -Raw HASNetMonitor.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $version) { throw 'HASNetMonitor.csproj has no <Version>' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # A tag v<version> means this exact version already shipped. gh exits non-zero
          # when the tag is absent, which is the case that should build.
          gh release view "v$version" --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v$version is already released; nothing to build"
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            Write-Host "v$version is new; building it"
            "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

  installer:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # The project targets net11.0-windows; the shipped exe is the net48 build.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # The version baked into the Setup file name and the wizard comes from the one
      # place the app reads it: <Version> in HASNetMonitor.csproj. The gate job already
      # read it; this job reads it again so the build does not depend on job outputs.
      - name: Read version from the project file
        shell: pwsh
        run: |
          $xml = [xml](Get-Content -Raw HASNetMonitor.csproj)
          $version = ($xml.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
          if (-not $version) { throw 'HASNetMonitor.csproj has no <Version>' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "version $version"

      # Inno Setup 6 ships on the Windows images but is not on PATH. Prefer the
      # preinstalled copy; install it only if an image update ever drops it.
      - name: Locate Inno Setup compiler
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $onPath = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($onPath) { $iscc = $onPath.Source }
          }
          if (-not $iscc) {
            Write-Host 'Inno Setup not found; installing it.'
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe could not be found or installed' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "using $iscc"

      # The same publish command documented in the .iss and README. The output is the
      # app: one exe, no runtime to download, nothing to install alongside it.
      - name: Publish the net48 build
        shell: pwsh
        run: dotnet publish HASNetMonitor.csproj -c Release -f net48 -o publish

      - name: Check the publish output
        shell: pwsh
        run: |
          $exe = 'publish\HASNetMonitor.exe'
          if (-not (Test-Path $exe)) { throw "publish did not produce $exe" }
          Write-Host ("{0:N0} bytes" -f (Get-Item $exe).Length)

      - name: Compile the installer
        shell: pwsh
        run: |
          & $env:ISCC "/DAppVersion=$env:APP_VERSION" 'installer\HASNetMonitor.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Check the installer output
        shell: pwsh
        run: |
          $setup = "installer\Output\HASNetMonitor-Setup.exe"
          if (-not (Test-Path $setup)) { throw "ISCC did not produce $setup" }
          Write-Host ("{0:N0} bytes" -f (Get-Item $setup).Length)

      - uses: actions/upload-artifact@v4
        with:
          name: HASNetMonitor-Setup
          path: installer/Output/HASNetMonitor-Setup.exe
          if-no-files-found: error

      # The artifact above is only reachable from this run while signed in and expires.
      # A release is what gives users a permanent download link on the repository page.
      - name: Publish the Setup as a GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $setup = "installer\Output\HASNetMonitor-Setup.exe"
          if (-not (Test-Path $setup)) { throw "no Setup to publish: $setup" }

          $notes = @"
          HAS NetMonitor $env:APP_VERSION - single-file Setup for Windows 10 1903+ and Windows 11.

          Download HASNetMonitor-Setup.exe and run it. Setup is per-user, so it
          needs no admin rights, and there is no runtime to download: the app targets the .NET
          Framework 4.8 that Windows already has.

          Your settings live in %APPDATA%\HASNetMonitor\config.json and are kept on reinstall,
          upgrade and uninstall unless you tick the box that asks to delete them.

          MIT License - Must credit Md Hanif Ali Sohag as the original author. Full text in LICENSE.
          "@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          # The gate job only lets a new version through, so this normally creates the
          # release. A manual workflow_dispatch can still re-run an already-released
          # version; replacing the asset keeps that a no-op instead of a red build.
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag exists; replacing its asset"
            gh release upload $tag $setup --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE" }
            gh release edit $tag --title "HAS NetMonitor $env:APP_VERSION" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release edit failed with exit code $LASTEXITCODE" }
          }
          else {
            Write-Host "creating release $tag"
            gh release create $tag $setup `
              --target "$env:GITHUB_SHA" `
              --title "HAS NetMonitor $env:APP_VERSION" `
              --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
          }

          # Prove the asset is attached rather than trusting the exit code.
          $assets = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "could not read back release $tag" }
          if ($assets -notcontains "HASNetMonitor-Setup.exe") {
            throw "release $tag does not carry the Setup exe; got: $assets"
          }
          Write-Host "release $tag carries $(Split-Path -Leaf $setup)"
